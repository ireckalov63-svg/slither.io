<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Название вашей игры</title>
    
    <!-- Оптимизация -->
    <link rel="preconnect" href="https://yandex.ru">
    <link rel="preconnect" href="https://yandex.net">

    <!-- Иконка -->
    <link rel="icon" type="image/png" href="icon.png">

    <link rel="stylesheet" href="style.css">

    <!-- Подключение SDK Яндекс Игр -->
    <script src="https://yandex.ru/games/sdk/v2"></script>
</head>
<body>

  <!-- Экран загрузки -->
  <div id="loading-screen" class="loading-screen">
    <div class="loading-text">Загрузка...</div>
  </div>

  <!-- Главное меню -->
  <div class="menu-screen" id="menu-screen" style="display: none;">
    <button class="menu-play">Играть</button>
    <button class="menu-skins">Скины</button>
  </div>

  <!-- Экран скинов -->
  <div class="skins-screen" id="skins-screen" style="display: none;">
    <button class="skins-arrow-left">←</button>
    <div class="skins-preview"></div>
    <button class="skins-arrow-right">→</button>
    <button class="skins-select">Выбрать</button>
  </div>

  <!-- Экран после смерти -->
  <div class="gameover-screen" id="gameover-screen" style="display: none;"> 
    <h2>💀 Игра окончена!</h2>
    <p>Ваша длина: <span class="go-length">0</span></p>
    <p>🏆 Рекорд: <span class="go-best">0</span></p>
    <button class="menu-play">Играть снова</button>
    <button class="menu-skins">В меню</button>
  </div>

  <!-- Контейнер для уведомлений о баффах -->
  <div id="buff-notifications" class="buff-notifications"></div>

  <!-- Игровое поле -->
  <div class="game-screen" id="game-screen" style="display: none;">
    <canvas id="game-canvas"></canvas>

    <!-- Баффы -->
    <div class="buffs-container">
      <button id="buff-magnet" title="Магнит" aria-label="Активировать магнит" role="button">
        <img src="img/magnit.png" class="buff-icon" alt="Магнит">
        <span class="buff-cooldown"></span>
      </button>
      <button id="buff-shield" title="Щит" aria-label="Активировать щит" role="button">
        <img src="img/shield.png" class="buff-icon" alt="Щит">
        <span class="buff-cooldown"></span>
      </button>
      <button id="buff-speed" title="Ускорение" aria-label="Активировать ускорение" role="button">
        <img src="img/boost.png" class="buff-icon" alt="Ускорение">
        <span class="buff-cooldown"></span>
      </button>
      <button id="buff-freeze" title="Заморозка" aria-label="Заморозить ботов" role="button">
        <img src="img/freeze.png" class="buff-icon" alt="Заморозка">
        <span class="buff-cooldown"></span>
      </button>
    </div>

    <!-- Индикаторы -->
    <div class="active-buffs">
      <img src="img/shield.png" id="shield-indicator" class="buff-active" alt="Щит активен" hidden>
      <img src="img/boost.png" id="speed-indicator" class="buff-active" alt="Ускорение активно" hidden>
      <img src="img/magnit.png" id="magnet-indicator" class="buff-active" alt="Магнит активен" hidden>
      <img src="img/freeze.png" id="freeze-indicator" class="buff-active" alt="Заморозка активна" hidden>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
