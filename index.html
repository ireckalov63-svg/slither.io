<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Яндекс Игра</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Главное меню -->
  <div class="menu-screen">
    <button class="menu-play">Играть</button>
    <button class="menu-skins">Скины</button>
  </div>

  <!-- Экран скинов -->
  <div class="skins-screen">
    <button class="skins-arrow-left">←</button>
    <div class="skins-preview"></div>
    <button class="skins-arrow-right">→</button>
    <button class="skins-select">Выбрать</button>
  </div>

  <!-- Экран после смерти -->
  <div class="gameover-screen"> 
    <h2>Игра окончена!</h2>
    <p>Ваша длина: <span class="go-length">0</span></p>
    <p>🏆 Рекорд: <span class="go-best">0</span></p>
    <button class="menu-play">Играть снова</button>
    <button class="menu-skins">В меню</button>
  </div>

  <!-- Игровое поле -->
  <div class="game-screen">
    <canvas id="game-canvas"></canvas>
  </div>
  <script src="./script.js"></script>
</body>
</html>
